<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenDJ</title>
  <meta name="description" content="OpenDJ is a free, open-source DJ app for Windows and macOS.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#d3d7dc" media="(prefers-color-scheme: light)">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="wrap top">
    <span class="brand"><img src="favicon.png" alt="" width="28" height="28"> OpenDJ</span>
    <a href="https://github.com/oscargradisar/OpenDJ">GitHub</a>
  </header>

  <main class="wrap">
    <section class="decks">
      <div class="record a" aria-hidden="true"><span></span></div>
      <div class="center">
        <h1>OpenDJ</h1>
        <p class="sub">Free DJ app. Windows and macOS.</p>
        <a class="btn" href="https://github.com/oscargradisar/OpenDJ/releases/latest">Download</a>
      </div>
      <div class="record b" aria-hidden="true"><span><img src="cherry.svg" alt="" width="22" height="22"></span></div>
    </section>

    <img class="shot" src="img/hero.png" alt="OpenDJ with two decks, the mixer and the library" width="1440" height="900">

    <section class="support">
      <h2><img src="cherry.svg" alt="" width="20" height="20"> Support OpenDJ</h2>
      <p class="sub">Free forever. Tips keep it going.</p>
      <a class="btn alt" href="https://paypal.me/OscarGradisar">Donate with PayPal</a>
    </section>
  </main>

  <footer class="wrap">MIT licensed · <a href="https://github.com/oscargradisar/OpenDJ">Source on GitHub</a></footer>
</body>
</html>
