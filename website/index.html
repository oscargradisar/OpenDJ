<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenDJ</title>
  <meta name="description" content="OpenDJ is a free, open-source DJ app for Windows and macOS.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#d3d7dc" media="(prefers-color-scheme: light)">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="wrap top">
    <span class="brand"><img src="favicon.png" alt="" width="28" height="28"> OpenDJ</span>
    <a href="https://github.com/oscargradisar/OpenDJ">GitHub</a>
  </header>

  <main class="wrap">
    <section class="decks">
      <div class="record a" aria-hidden="true"><span></span></div>
      <div class="center">
        <h1>OpenDJ</h1>
        <p class="sub">Free DJ app. Windows and macOS.</p>
        <a class="btn" id="dl" href="https://github.com/oscargradisar/OpenDJ/releases/download/v0.3.8-beta/OpenDJ-0.3.8-beta-win-x64.zip" data-asset="win-x64">Download for Windows</a>
        <p class="platforms">
          <a href="https://github.com/oscargradisar/OpenDJ/releases/download/v0.3.8-beta/OpenDJ-0.3.8-beta-win-x64.zip" data-asset="win-x64">Windows</a> ·
          <a href="https://github.com/oscargradisar/OpenDJ/releases/download/v0.3.8-beta/OpenDJ-0.3.8-beta-win-arm64.zip" data-asset="win-arm64">Windows ARM</a> ·
          <a href="https://github.com/oscargradisar/OpenDJ/releases/download/v0.3.8-beta/OpenDJ-0.3.8-beta-mac-universal.zip" data-asset="mac-universal">macOS</a>
        </p>
      </div>
      <div class="record b" aria-hidden="true"><span><img src="cherry.svg" alt="" width="22" height="22"></span></div>
    </section>

    <img class="shot" src="img/hero.png" alt="OpenDJ with two decks, the mixer and the library" width="1440" height="900">

    <section class="support">
      <h2><img src="cherry.svg" alt="" width="20" height="20"> Support OpenDJ</h2>
      <p class="sub">Free forever. Tips keep it going.</p>
      <a class="btn alt" href="https://paypal.me/OscarGradisar">Donate with PayPal</a>
    </section>

    <!-- No backend: the form opens a pre-filled GitHub issue, so feedback lands in the repo's Issues. -->
    <form class="support feedback" action="https://github.com/oscargradisar/OpenDJ/issues/new" method="get" target="_blank">
      <h2>Feedback</h2>
      <input type="hidden" name="title" value="Feedback from the website">
      <label class="sr" for="fb">Your feedback</label>
      <textarea id="fb" name="body" rows="4" required placeholder="Ideas, bugs, anything."></textarea>
      <button class="btn alt" type="submit">Send on GitHub</button>
    </form>
  </main>

  <footer class="wrap">MIT licensed · <a href="https://github.com/oscargradisar/OpenDJ">Source on GitHub</a></footer>

  <script>
    // Links above are the current release; this swaps in the newest one so the site never needs editing per release.
    const dl = document.getElementById('dl');
    if (/Mac/.test(navigator.platform)) { dl.dataset.asset = 'mac-universal'; dl.textContent = 'Download for macOS'; dl.href = document.querySelector('[data-asset="mac-universal"]').href; }
    fetch('https://api.github.com/repos/oscargradisar/OpenDJ/releases/latest')
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(rel => {
        for (const a of document.querySelectorAll('[data-asset]')) {
          const asset = rel.assets.find(x => x.name.endsWith('-' + a.dataset.asset + '.zip'));
          if (asset) a.href = asset.browser_download_url;
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
