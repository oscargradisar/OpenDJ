name: Playback regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run test:load
      - run: npm run test:audio -- --out out/sync.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playback-results
          path: out/
          if-no-files-found: ignore
